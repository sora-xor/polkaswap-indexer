name: CI

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches:
      - develop
      - master
  push:
    branches:
      - develop
      - master

permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Branch flow audit
        run: |
          bash scripts/test-branch-flow-audit.sh
          bash scripts/audit-branch-flow.sh

      - name: Audit public artifacts
        run: |
          bash scripts/test-public-artifacts-audit.sh
          bash scripts/audit-public-artifacts.sh

      - name: TODO debt audit
        run: |
          bash scripts/test-todo-debt-audit.sh
          bash scripts/audit-todo-debt.sh

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Validate dependency constraints
        run: yarn constraints

      - name: Reject duplicate dependency resolutions
        run: yarn dedupe --check

      - name: Audit all dependencies
        run: yarn audit:dependencies

      - name: Audit production dependencies
        run: yarn audit:dependencies:production

      - name: Run deployment evidence audit tests
        run: |
          yarn test:deployment-evidence-template
          yarn generate:deployment-evidence-template --output build/reports/production-deployment-evidence-template.json
          yarn test:deployment-evidence-audit
          yarn audit:deployment-evidence

      - name: Run deployment manifest contract tests
        run: yarn test:deployment-manifest

      - name: Run production smoke contract tests
        run: yarn test:production-smoke

  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: validate
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: polkaswap
          POSTGRES_PASSWORD: polkaswap
          POSTGRES_DB: polkaswap_indexer_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U polkaswap -d polkaswap_indexer_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Validate Docker Compose deployment
        run: |
          docker compose --profile postgres config --quiet
          docker compose --profile rocksdb config --quiet
          POLKASWAP_INDEXER_IMAGE_REPOSITORY=registry.invalid/polkaswap-indexer \
          POLKASWAP_INDEXER_IMAGE_DIGEST=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
          POLKASWAP_MIGRATION_OWNER_DATABASE_URL=postgres://migration-owner:owner-test-only@database.invalid:5432/polkaswap?sslmode=verify-full \
          POLKASWAP_API_DATABASE_URL=postgres://api-runtime:api-test-only@database.invalid:5432/polkaswap?sslmode=verify-full \
          POLKASWAP_WORKER_DATABASE_URL=postgres://worker-runtime:worker-test-only@database.invalid:5432/polkaswap?sslmode=verify-full \
          POLKASWAP_SORA_WS_ENDPOINT=wss://primary.invalid \
          POLKASWAP_SORA_ARCHIVE_WS_ENDPOINT=wss://archive.invalid \
          POLKASWAP_CHAIN_START_BLOCK=14000000 \
            docker compose -f docker-compose.production.yml config --quiet

      - name: Build
        run: yarn build

      - name: Test
        run: yarn test
        env:
          POSTGRES_TEST_DATABASE_URL: postgres://polkaswap:polkaswap@127.0.0.1:5432/polkaswap_indexer_test

      - name: Reject whitespace errors
        run: git diff --check

      - name: Build production container
        run: docker build --tag polkaswap-indexer:ci .

      - name: Verify production image user and dependency boundary
        run: |
          test "$(docker image inspect --format '{{.Config.User}}' polkaswap-indexer:ci)" = node
          docker run --rm --entrypoint node polkaswap-indexer:ci -e \
            "const {createRequire}=await import('node:module');const require=createRequire(import.meta.url);for(const name of ['@babel/runtime/helpers/typeof','@graphql-tools/schema','@harperfast/rocksdb-js','@polkadot/api','@sora-substrate/type-definitions','graphql','graphql-ws','graphql-yoga','pg','ws'])require.resolve(name);for(const name of ['tsx','typescript','vitest']){let found=true;try{require.resolve(name)}catch{found=false}if(found)throw new Error('development dependency shipped: '+name)}"

      - name: Verify native RocksDB runtime in production container
        run: >-
          docker run --rm --entrypoint node polkaswap-indexer:ci -e
          "import('@harperfast/rocksdb-js').then(async ({RocksDatabase})=>{const db=RocksDatabase.open('/data/ci-native-smoke.rocksdb');await db.put('ready',true);if(db.getSync('ready')!==true)throw new Error('RocksDB native round trip failed');db.close()})"

      - name: Verify production PostgreSQL migration and runtime handoff
        run: POLKASWAP_TEST_IMAGE=polkaswap-indexer:ci yarn test:production-database-deployment
