name: Polkaswap ChatGPT
on:
  pull_request:
    paths:
      - 'packages/polkaswap-chatgpt/**'
      - '.github/workflows/polkaswap-chatgpt.yml'
  push:
    branches: ['feature/polkaswap-chatgpt-plugin']
permissions:
  contents: read
jobs:
  plugin:
    name: polkaswap-chatgpt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/polkaswap-chatgpt
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn npm audit --all --recursive --severity low --no-deprecations
      - run: yarn npm audit --all --recursive --environment production --severity low --no-deprecations
      - run: yarn lint
      - run: yarn typecheck
      - run: yarn test
      - run: yarn build
      - run: yarn package
      - run: python3 -m unittest discover -s ops -p 'test_*.py'
      - run: bash -n ops/run-server.sh ops/activate-release.sh ops/rollback.sh
