x-runtime-security: &runtime-security
  image: "${POLKASWAP_INDEXER_IMAGE_REPOSITORY:?Set the reviewed image repository}@sha256:${POLKASWAP_INDEXER_IMAGE_DIGEST:?Set the reviewed 64-hex image digest}"
  init: true
  restart: unless-stopped
  read_only: true
  user: "node"
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  pids_limit: 128
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=16m

services:
  api:
    <<: *runtime-security
    command: ["node", "dist/src/index.js"]
    ports:
      - "127.0.0.1:4350:4350"
    environment:
      NODE_ENV: production
      DATABASE_URL: "${POLKASWAP_DATABASE_URL:?Set the externally managed PostgreSQL URL}"
      HOST: 0.0.0.0
      PORT: "4350"
      GRAPHQL_PATH: /graphql
      GRAPHQL_HTTP_MAX_BODY_BYTES: "65536"
      HTTP_MAX_HEADER_BYTES: "16384"
      HTTP_MAX_CONNECTIONS: "2048"
      HTTP_MAX_REQUESTS_PER_SOCKET: "1000"
      RATE_LIMIT_WINDOW_MS: "60000"
      RATE_LIMIT_MAX: "50000"
      RATE_LIMIT_MAX_KEYS: "20000"
      RATE_LIMIT_GLOBAL_WINDOW_MS: "60000"
      RATE_LIMIT_GLOBAL_MAX: "50000"
      GRAPHQL_MAX_DEPTH: "12"
      GRAPHQL_MAX_FIELDS: "300"
      GRAPHQL_MAX_ALIASES: "50"
      GRAPHQL_ALLOW_INTROSPECTION: "false"
      GRAPHQL_WS_MAX_PAYLOAD_BYTES: "65536"
      GRAPHQL_WS_MAX_CONNECTIONS: "512"
      GRAPHQL_WS_MAX_CONNECTIONS_PER_CLIENT: "512"
      GRAPHQL_WS_MAX_OPERATIONS_PER_CONNECTION: "32"
      GRAPHQL_WS_CONNECTION_INIT_TIMEOUT_MS: "10000"
  worker:
    <<: *runtime-security
    command: ["node", "dist/src/worker/index.js"]
    healthcheck:
      test: ["CMD", "node", "dist/src/scripts/worker-health.js"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    environment:
      NODE_ENV: production
      DATABASE_URL: "${POLKASWAP_DATABASE_URL:?Set the externally managed PostgreSQL URL}"
      SORA_WS_ENDPOINT: "${POLKASWAP_SORA_WS_ENDPOINT:?Set the reviewed SORA mainnet WSS endpoint}"
      SORA_ARCHIVE_WS_ENDPOINT: "${POLKASWAP_SORA_ARCHIVE_WS_ENDPOINT:?Set an independently reviewed SORA mainnet archive WSS endpoint}"
      CHAIN_START_BLOCK: "${POLKASWAP_CHAIN_START_BLOCK:?Set the reviewed first SORA block to index}"
      PI_WORKER_HEALTH_TIMEOUT_MS: "4000"
      CHAIN_BATCH_SIZE: "25"
      CHAIN_STATE_REFRESH_INTERVAL_BLOCKS: "25"
      CHAIN_SNAPSHOT_INTERVAL_BLOCKS: "25"
