# nginx reopens logs on SIGUSR1 (macOS signal30), without restarting.
# logfile owner:group mode count size(KiB) when flags pid_file signal
/opt/homebrew/var/log/nginx/access.log nobody:admin 644 5 102400 * CJ /opt/homebrew/var/run/nginx.pid 30
/opt/homebrew/var/log/nginx/error.log nobody:admin 644 5 102400 * CJ /opt/homebrew/var/run/nginx.pid 30
