x-bounded-logging: &bounded-logging
  driver: local
  options:
    max-size: "${DOCKER_LOG_MAX_SIZE:-10m}"
    max-file: "${DOCKER_LOG_MAX_FILE:-5}"

services:
  postgres:
    image: postgres:16-alpine
    profiles:
      - postgres
    stop_grace_period: 4m
    logging: *bounded-logging
    environment:
      POSTGRES_DB: polkaswap_indexer
      POSTGRES_USER: polkaswap
      POSTGRES_PASSWORD: polkaswap
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U polkaswap -d polkaswap_indexer"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build: .
    profiles:
      - postgres
    restart: "no"
    stop_grace_period: 4m
    logging: *bounded-logging
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${POSTGRES_MIGRATION_DATABASE_URL:-postgres://polkaswap:polkaswap@postgres:5432/polkaswap_indexer}
      POSTGRES_MIGRATION_QUERY_TIMEOUT_MS: ${POSTGRES_MIGRATION_QUERY_TIMEOUT_MS:-0}
      POSTGRES_MIGRATION_STATEMENT_TIMEOUT_MS: ${POSTGRES_MIGRATION_STATEMENT_TIMEOUT_MS:-0}
    healthcheck:
      disable: true
    command: ["node", "dist/src/db/migrate.js"]

  api:
    build: .
    profiles:
      - postgres
    stop_grace_period: 4m
    logging: *bounded-logging
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: ${POSTGRES_API_DATABASE_URL:-postgres://polkaswap:polkaswap@postgres:5432/polkaswap_indexer}
      SKIP_POSTGRES_MIGRATION: "true"
      HOST: 0.0.0.0
      PORT: 4350
      GRAPHQL_PATH: /graphql
    ports:
      - "4350:4350"
    command: ["node", "dist/src/index.js"]

  worker:
    build: .
    profiles:
      - postgres
    stop_grace_period: 4m
    logging: *bounded-logging
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: ${POSTGRES_WORKER_DATABASE_URL:-postgres://polkaswap:polkaswap@postgres:5432/polkaswap_indexer}
      SKIP_POSTGRES_MIGRATION: "true"
      SORA_WS_ENDPOINT: wss://mof2.sora.org
      CHAIN_BATCH_SIZE: 25
      CHAIN_STATE_REFRESH_INTERVAL_BLOCKS: 25
      CHAIN_SNAPSHOT_INTERVAL_BLOCKS: 25
      WORKER_METRICS_HOST: 127.0.0.1
      WORKER_METRICS_PORT: 9464
    healthcheck:
      test: ["CMD", "node", "-e", "const port=Number(process.env.WORKER_METRICS_PORT??'9464');fetch('http://127.0.0.1:'+port+'/health').then(async response=>{if(!response.ok)throw new Error('worker not ready');const body=await response.json();if(body?.ok!==true)throw new Error('worker not ready')}).then(()=>process.exit(0)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    command: ["node", "dist/src/worker/index.js"]

  combined-rocksdb:
    build: .
    stop_grace_period: 4m
    logging: *bounded-logging
    profiles:
      - rocksdb
    environment:
      STORAGE_ENGINE: rocksdb
      ROCKSDB_PATH: /data/polkaswap-indexer.rocksdb
      HOST: 0.0.0.0
      PORT: 4350
      GRAPHQL_PATH: /graphql
      SORA_WS_ENDPOINT: wss://mof2.sora.org
      CHAIN_BATCH_SIZE: 25
      CHAIN_STATE_REFRESH_INTERVAL_BLOCKS: 25
      CHAIN_SNAPSHOT_INTERVAL_BLOCKS: 25
    ports:
      - "4350:4350"
    volumes:
      - rocksdb-data:/data
    command: ["node", "dist/src/combined.js"]

volumes:
  postgres-data:
  rocksdb-data:
